# ScenarioEditorWeb 로컬 인프라 — InterfaceServer(+ 전용 ZooKeeper)와 이력 서버(HttpWebServer + 전용 ZooKeeper). Mongo·Redis·Cassandra 는 이미 떠 있는 컨테이너를 쓴다.
# 프로필 ss(평소에는 뜨지 않는다): 스냅샷 서버 맞춤 확인용 ARSSnapShotServer + 전용 ZooKeeper — `docker compose -f infra/docker-compose.yml --profile ss up -d`
# 선례: ARSAgent tools/integration 의 is 프로필.
name: sew-infra
services:
  # ── InterfaceServer: 저장·삭제(HTTP 8080)와 Vision·OCR 판정 중계(gRPC 9300 → 호스트 9310, P4) ──
  # 판정 요청은 ZooKeeper `/EARS/ARSImageProcessingSrv/daemons`·`/EARS/ARSOCRProcessingSrv/daemons` 의 자식 노드(호스트:포트)로 중계된다.
  # 공유 로컬 ZooKeeper(ars-zookeeper)를 쓰지 않도록 전용으로 하나 둔다 — InterfaceServer 는 뜰 때 자기 주소를 올리고 같은 이름을 지운다.
  # 호스트 2191 은 흉내 판정 서버·VisionServer 맞춤 확인이 노드를 보는 데 쓴다(tools/infra/is-zk.js 는 컨테이너 안의 zkCli 를 쓴다).
  is-zookeeper:
    image: zookeeper:3.5.5
    ports:
      - "127.0.0.1:2191:2181"
    # 가벼운 확인(JVM 을 띄우지 않는다) — srvr 는 3.5 에서 기본으로 열려 있는 네 글자 명령이다
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 5s
      timeout: 5s
      retries: 12
  # 환경 변수 MODE=DEBUG 를 주지 않는다 — 주면 ZooKeeper 를 아예 쓰지 않아 판정 요청이 늘 10초 뒤 INTERNAL 이다.
  # JVM 속성 -DMODE=DEBUG 는 남긴다(RV 를 건너뛴다). InterfaceServer 는 ZooKeeper 에 붙은 뒤에야 Mongo 를 붙이므로
  # ZooKeeper 가 준비된 뒤에 띄운다 — ZooKeeper 에 붙지 못한 채 뜨면 Mongo 를 끝내 붙이지 않아 저장·삭제가 컨테이너를 다시 띄울 때까지 실패한다.
  # 준비됐는지는 tools/infra/smoke-is.sh 가 저장 경로로 본다(60초 안에 되지 않으면 interface-server 컨테이너를 다시 띄운다).
  interface-server:
    image: eclipse-temurin:8-jre
    depends_on:
      is-zookeeper:
        condition: service_healthy
    environment:
      HOST_IP: 127.0.0.1
      HTTP_PORT: "8080"
      VISION_PORT: "9300"
      THRIFT_VISION_PORT: "9301"
      REDIS_PASSWORD: visuallove
    volumes:
      - ./is/dist:/opt/is:ro
      - ./is/conf:/ears/conf/EARSInterfaceSrv:ro
    command:
      - java
      - -Xmx1536m
      - -DMODE=DEBUG
      - -DEEG_BASE=/ears
      - -Dlog4j.configuration=file:/ears/conf/EARSInterfaceSrv/log4j.properties
      - -cp
      - /opt/is/EARSInterfaceSrv.jar:/opt/is/lib/*:/opt/is/inhouse-stubs-1.0.jar
      - com.sec.eeg.ars.actor.Master
      - start
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9310:9300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g

  # ── 이력 서버(P3-D): HttpWebServer — 스냅샷 이력 보기(GET /ARS/History/{설비}/{txn})와 시험 이력 넣기(POST /ARS/AppendHistory) ──
  # 실행 파일은 tools/infra/prepare-hws.sh 가 HttpWebServer 의 커밋된 판을 저장소 밖에서 빌드해 infra/hws/dist 에 둔다.
  # 뜰 때 ZooKeeper 에 자기 주소를 올린다 — 공유 로컬 ZooKeeper(ars-zookeeper)에 올리지 않도록 전용으로 하나 둔다.
  # Cassandra 는 my-cassandra-server(호스트 9042, 계정은 HttpWebServer 코드값). Mongo 는 뜰 때 메일 틀 한 건을 읽기만 하고, Redis 에는 ping 만 보낸다
  # (메일·팝업 경로는 부르지 않는다 — 이 서버는 127.0.0.1 에만 열린다).
  hws-zookeeper:
    image: zookeeper:3.5.5
  http-web-server:
    image: eclipse-temurin:8-jre
    depends_on: [hws-zookeeper]
    environment:
      HOST_IP: 127.0.0.1
      HTTP_PORT: "8082"
      TZ: Asia/Seoul
    volumes:
      - ./hws/dist:/ears/parcels/HttpWebServer:ro
      - ./hws/conf:/ears/conf/HttpWebServer:ro
    command:
      - java
      - -Xmx512m
      - -Duser.timezone=Asia/Seoul
      - -Dfile.encoding=UTF-8
      - -DEEG_BASE=/ears
      - -Dlog4j.configuration=file:/ears/conf/HttpWebServer/log4j.properties
      - -cp
      - /ears/parcels/HttpWebServer/HttpWebServer.jar:/ears/parcels/HttpWebServer/lib/*
      - com.sec.eeg.ars.actor.Master
      - start
    ports:
      - "127.0.0.1:8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g

  # ── 프로필 ss: 스냅샷 서버 맞춤 확인(tools/infra/check-ss-compat.js) ──
  # 스냅샷 서버는 뜰 때 ZooKeeper 에 자기 주소를 올린다. 공유 로컬 ZooKeeper(ars-zookeeper)에 올리지 않도록 전용으로 하나 둔다.
  ss-zookeeper:
    profiles: [ss]
    image: zookeeper:3.5.5
  # Cassandra 는 이미 떠 있는 my-cassandra-server(호스트 9042). 계정은 infra/.env(git 제외, tools/infra/prepare-ss.sh 가 server/.env 에서 만든다).
  # TZ 는 사내와 같게 Asia/Seoul — 스냅샷 서버는 파일 ms 를 JVM 시간대로 읽어 파티션 연·월·일을 정한다.
  snapshot-server:
    profiles: [ss]
    image: eclipse-temurin:8-jre
    depends_on: [ss-zookeeper]
    environment:
      HOST_IP: 127.0.0.1
      HTTP_PORT: "8081"
      Username: ${SS_CASSANDRA_USERNAME:-}
      Password: ${SS_CASSANDRA_PASSWORD:-}
      TZ: Asia/Seoul
    volumes:
      - ./ss/dist:/opt/ss:ro
      - ./ss/conf:/ears/conf/ARSSnapShotServer:ro
    command:
      - java
      - -Xmx512m
      - -Duser.timezone=Asia/Seoul
      - -DEEG_BASE=/ears
      - -Dlog4j.configuration=file:/ears/conf/ARSSnapShotServer/log4j.properties
      - -cp
      - /opt/ss/ARSSnapShotServer.jar:/opt/ss/lib/*
      - com.sec.eeg.ars.actor.Master
      - start
    ports:
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
