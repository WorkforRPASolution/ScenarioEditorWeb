akka {
    loggers = ["akka.event.slf4j.Slf4jLogger"]

    loglevel = "INFO"

    stdout-loglevel = "INFO"

    logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

    http.server.remote-address-header = on
    # 시험용: 100MB 넘는 시험 시나리오 적재 (저장소 기본 100m, 사내 값은 미확인 — Q-006)
    http.parsing.max-content-length = 512m

    # 로컬 전용: 판정 서버로 가는 gRPC 연결을 끝없이 다시 붙인다(akka-grpc 1.0.0-M1 기본은 20번 실패하면 영구히 닫힌다 —
    # 흉내 판정 서버가 없는 동안 요청이 가면 그 주소의 연결이 죽는다). 사내 값이 아니다.
    grpc.client."*".connection-attempts = -1
}
